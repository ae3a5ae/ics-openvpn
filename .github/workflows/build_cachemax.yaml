
name: Build_cachemax

permissions:
  contents: read

on:
  workflow_dispatch:
    push:
    paths:
      - 'main/**'
      - 'gradle/**'
      - '*.gradle*'
      - 'settings.gradle*'
      - 'build.gradle*'
      - 'gradle.properties'
      - '.github/workflows/build.yaml'

jobs:
  build:
    name: Release UiOvpn2
    runs-on: ubuntu-latest

    steps:
      - name: Checkout the code
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: 25
          distribution: temurin

      # Gradle dependencies, wrapper distributions and build cache.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Configure Gradle
        run: |
          mkdir -p ~/.gradle
          cat >> ~/.gradle/gradle.properties <<'EOF'
          icsopenvpnDebugSign=true
          org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
          org.gradle.caching=true
          org.gradle.parallel=true
          EOF

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses || true

      - name: Install Android NDK and CMake
        run: |
          sdkmanager --install \
            "ndk;30.0.14904198" \
            "cmake;3.22.1"
      - name: Check Android SDK platforms
        run: sdkmanager --list | grep "platforms;android-"

      # Cache CMake/Ninja native build intermediates.
      # Restore an older cache when C++ sources change, allowing
      # Ninja to rebuild only affected native targets.
      - name: Cache native build
        uses: actions/cache@v4
        with:
          path: |
            main/.cxx
            main/.externalNativeBuild
          key: ${{ runner.os }}-ndk-30.0.14904198-${{ hashFiles('main/src/main/cpp/**', 'main/build.gradle.kts', 'gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-ndk-30.0.14904198-

      - name: Build the app
        run: |
          ./gradlew \
            --build-cache \
            assembleUiOvpn2Release

      - name: Find generated APKs
        run: |
          echo "APK files:"
          find . -type f -name "*.apk"

          echo "Build outputs:"
          find main/build/outputs -maxdepth 5 -type f 2>/dev/null

      - name: Archive APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-UiOvpn23-release-apk
          path: main/build/outputs/apk/**/*.apk
          if-no-files-found: error
